# dsh-1bot bundle patch：把 onebot 插件挂进 profile。
# 运行配置在用户层 $DSH_HOME/profiles/onebot/cordis.patch.yml，优先级高于本文件；
# id 定向 patch 整段替换该行 config，覆盖时需重述所有保留字段。

# 会话持久化根改到 sessions-hidden，与 web 扫描的 sessions/ 隔离，
# 防止 web UI resume 同一日志造成双写损坏（原理详见 src/session.ts）。
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions-hidden')

# 挂载插件行——没有它插件不会被加载，首次运行的配置模板门也不会触发。
# 只写 enabled: true（配置门依赖它，否则 apply 在门之前就返回），其余字段全部走
# config.ts 的 DEFAULTS 与各 adapter 自己声明的默认值，避免两处默认值漂移。
- insert:
    - id: onebot
      name: 'dsh-1bot'
      config:
        enabled: true
